  <circle cx="1090" cy="160" r="80" fill="none" stroke="#6ee7b7" stroke-opacity="0.2"/>
  <path d="M78 80h48" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  <text x="78" y="177" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="-2">Learn. Build. Destroy. Relearn. Rebuild.</text>
  <text x="82" y="228" fill="#b4c0d3" font-family="Segoe UI, Arial, sans-serif" font-size="18" letter-spacing="3">IDEAS INTO THINGS THAT MATTER.</text>
  <path d="m1055 139-22 22 22 22m69-44 22 22-22 22m-30-55-17 66" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect y="314" width="1200" height="6" fill="url(#accent)"/>
